services:
  - type: web
    name: marginleak
    runtime: python
    plan: starter
    region: oregon
    buildCommand: |
      pip install -r backend/requirements.txt
      cd frontend && npm install && npm run build && cd ..
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TINKER_API_KEY
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: PRICE_TOLERANCE_PERCENT
        value: "2.0"
      - key: HISTORICAL_ALERT_PERCENT
        value: "5.0"
