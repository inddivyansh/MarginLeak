services:
  - type: web
    name: marginleak
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marginleak-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: TABPFN_ENABLED
        value: "false"
      - key: TINKER_API_KEY
        sync: false
      - key: TINKER_MODEL_PATH
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: "https://marginleak.onrender.com,http://localhost:5173"
      - key: BACKBOARD_API_KEY
        sync: false
      - key: PRICE_TOLERANCE_PERCENT
        value: "2.0"
      - key: HISTORICAL_ALERT_PERCENT
        value: "5.0"

databases:
  - name: marginleak-db
    databaseName: marginleak
    user: marginleak
    plan: starter
